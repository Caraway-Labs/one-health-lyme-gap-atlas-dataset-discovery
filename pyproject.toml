[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "one-health-lyme-gap-atlas-dataset-discovery"
version = "0.1.0"
description = "Governed Dataset Discovery recommendations for the One Health Lyme Gap Atlas"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=0.6,<2",
  "pydantic>=2.10,<3",
  "openai>=2.54,<2.55",
  "snowflake-connector-python>=4.3,<5",
  "one-health-lyme-gap-atlas-shared @ git+https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-shared-python.git@v0.1.6",
]

[project.scripts]
dataset-discovery-review = "lyme_gap_atlas_dataset_discovery.review_cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]
eval = []

[tool.hatch.build.targets.wheel]
packages = ["src/lyme_gap_atlas_dataset_discovery"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lyme_gap_atlas_dataset_discovery"]
